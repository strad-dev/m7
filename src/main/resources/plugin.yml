name: m7
version: '${project.version}'
main: plugin.M7
api-version: '26.2'

commands:
  setup:
    description: Reset the dungeon map and mobs
    usage: /setup
  # On the network the bare label belongs to StradDevHub's queue command (an alias of /m7), which force-claims
  # it at boot; ours stays reachable as /m7:m7practice, and that is what M7Bridge dispatches.
  m7practice:
    description: Begin practice (boss instructions only, for real players)
    usage: /m7practice <section> [--no-teleport]
  eq:
    description: View your equipment and current speed
    usage: /eq
    aliases: [stats]
  reset:
    description: Reset the dungeon to its pre-run state
    usage: /reset
  verbose:
    description: Toggle verbose debug messages
    usage: /verbose <off|timer|on|super> [player]
  setspeed:
    description: Set movement speed (100 = default); target self or a named player
    usage: /setspeed [player] [speed]
  terminal:
    description: Helper command to facilitate terminals phase
    usage: /terminal <section> <terminal>
  class:
    description: Pick your M7 class (shared with the network plugin's copy)
    usage: /class <archer|mage|tank|berserk|healer>
  m7loadout:
    description: Edit the saved kit for your selected class
    usage: /m7loadout [reset]
  # Both are Realistic-mode only; in any other mode the pet is assumed from what you are doing.
  pets:
    description: Summon one of your pets, or view another player's
    usage: /pets [player]
    aliases: [pet]
  petloadout:
    description: Rearrange the pets in your pet menu
    usage: /petloadout
  dungeonsettings:
    description: Show or change the dungeon settings (difficulty, mayor, watcherfix)
    usage: /dungeonsettings [difficulty [realistic|perfect_rng|classic] | mayor [jerry_paul|paul|jerry|other|derpy] | watcherfix [on|off] | badbonzo [on|off] | batbug [on|off]]